name: Windows build and tests
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build and test
        shell: pwsh
        run: ./scripts/verify.ps1
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: artifacts/test-results/**/*.trx
          if-no-files-found: ignore
      - name: Publish portable executable
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: ./scripts/publish.ps1 -Version '${{ github.ref_name }}'
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: TaskbarRunner-${{ github.ref_name }}-win-x64
          path: artifacts/TaskbarRunner-${{ github.ref_name }}-win-x64/
